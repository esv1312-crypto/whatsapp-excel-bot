<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>AI-OFFICE LIVE</title>
<style>
body{font-family:system-ui;margin:0;background:#111;color:#eee}
header{padding:18px;border-bottom:1px solid #333;position:sticky;top:0;background:#111;z-index:2}
#live{padding:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.card,.row{border:1px solid #333;border-radius:10px;padding:12px;background:#171717}
.card b{font-size:24px}.muted{color:#999}.ok{color:#7ee787}.bad{color:#ff7b72}.wait{color:#e3b341}
.row.office{border-color:#5b8cff;background:#171b2a}.state{font-weight:700}
pre{white-space:pre-wrap;word-break:break-word;max-height:260px;overflow:auto}
</style></head>
<body>
<header><b>AI-OFFICE LIVE BLACK BOX</b><div class="muted">Runtime + GitHub • автообновление 3 сек</div></header>
<main id="live">Загрузка…</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function stateLabel(e){
 if(e==='task.completed'||e==='verification.passed'||e==='retest.passed') return ['DONE','ok'];
 if(e==='task.failed'||e==='verification.failed'||e==='retest.failed'||e==='recovery.failed'||e==='recovery.exhausted') return ['СБОЙ','bad'];
 if(e==='task.accepted') return ['ПРИНЯТО','wait'];
 if(e==='task.started'||e==='gateway.route'||e==='ai.start'||e==='ai.attempt'||e==='recovery.started'||e==='retest.requested') return ['РАБОТАЕТ','ok'];
 if(e==='recovery.requested'||e==='failure.classified') return ['ВОССТАНОВЛЕНИЕ','wait'];
 if(e==='task.waiting_for_ai'||e==='task.state_changed') return ['ОЖИДАНИЕ','wait'];
 return ['СОБЫТИЕ','ok'];
}
async function tick(){
 try{
  const a=await fetch('/api/live').then(r=>r.json());
  const rows=a.filter(x=>x.workflow==='AI-OFFICE');
  const counts={work:0,done:0,fail:0,recovery:0,wait:0};
  rows.forEach(x=>{const s=stateLabel(x.event)[0]; if(s==='DONE')counts.done++; else if(s==='СБОЙ')counts.fail++; else if(s==='ВОССТАНОВЛЕНИЕ')counts.recovery++; else if(s==='ОЖИДАНИЕ')counts.wait++; else counts.work++});
  const cards='<div class="grid">'+[['Работает',counts.work],['Восстановление',counts.recovery],['Ожидание',counts.wait],['DONE',counts.done],['Сбоев',counts.fail]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><b>'+x[1]+'</b></div>').join('')+'</div>';
  const body=a.slice(0,100).map(x=>{
   const office=x.workflow==='AI-OFFICE', sl=stateLabel(x.event), bad=sl[1]==='bad';
   const raw=x.raw?.event||x.raw;
   return '<div class="row '+(office?'office':'')+'"><b>'+new Date(x.ts).toLocaleString()+'</b> — '+esc(x.workflow)+
    '<br><span class="state '+(bad?'bad':sl[1])+'">'+sl[0]+'</span> • '+esc(x.event)+
    (x.status?' • '+esc(x.status):'')+
    '<details><summary>Детали / evidence</summary><pre>'+esc(JSON.stringify(raw,null,2))+'</pre></details></div>';
  }).join('')||'<div class="row">Нет событий</div>';
  document.querySelector('#live').innerHTML=cards+body;
 }catch(e){document.querySelector('#live').textContent='Ошибка чтения live: '+e.message}
}
tick();setInterval(tick,3000);
</script></main></body></html>
