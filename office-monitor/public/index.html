<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AI-OFFICE LIVE</title><style>body{font-family:system-ui;margin:0;background:#111;color:#eee}header{padding:18px;border-bottom:1px solid #333;position:sticky;top:0;background:#111}#live{padding:12px}.row{border:1px solid #333;border-radius:10px;padding:10px;margin:8px 0}.ok{color:#7ee787}.bad{color:#ff7b72}.muted{color:#999}.office{border-color:#5b8cff;background:#171b2a}pre{white-space:pre-wrap;word-break:break-word}</style></head><body><header><b>AI-OFFICE LIVE BLACK BOX</b><div class="muted">Обновление каждые 3 секунды • GitHub + AI-OFFICE runtime</div></header><main id="live">Загрузка…</main><script>async function tick(){try{const a=await fetch('/api/live').then(r=>r.json());document.querySelector('#live').innerHTML=a.map(x=>{const office=x.workflow==='AI-OFFICE';const bad=office?(x.event==='task.failed'):(!office&&(x.jobs===0||x.conclusion==='failure'));const label=office?(x.event==='task.failed'?'СБОЙ':x.event==='task.waiting_for_ai'?'ЖДЁТ AI':'AI-ОФИС РАБОТАЕТ'):(bad?(x.jobs===0?'ТОЧКА СБОЯ: JOB НЕ СОЗДАН':'СБОЙ В JOB'):'РАБОТАЕТ');return '<div class="row '+(office?'office':'')+'"><b>'+new Date(x.ts).toLocaleString()+'</b> — '+x.workflow+'<br>'+((x.run_id?'Run '+x.run_id+' • ':'')+x.event+' • '+x.status+' • '+(x.conclusion||'—'))+'<br><span class="'+(bad?'bad':'ok')+'">'+label+'</span><details><summary>evidence</summary><pre>'+JSON.stringify(x.raw,null,2)+'</pre></details></div>'}).join('')||'Нет событий'}catch(e){document.querySelector('#live').textContent='Ошибка чтения live: '+e.message}}tick();setInterval(tick,3000)</script></main></body></html>
