name: AI-OFFICE CI
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Full office test suite
        run: |
          set +e
          failures=0
          : > office-audit.log
          for f in tests/*.js; do
            echo "=== $f ===" | tee -a office-audit.log
            node "$f" 2>&1 | tee -a office-audit.log
            rc=$?
            if [ "$rc" -ne 0 ]; then
              failures=$((failures+1))
              echo "FAIL $f" | tee -a office-audit.log
            else
              echo "PASS $f" | tee -a office-audit.log
            fi
          done
          echo "FAILURES=$failures" | tee -a office-audit.log
          exit "$failures"
      - name: Verify Pognali MCP
        if: always()
        run: |
          curl --fail --silent --show-error --max-time 30 -X POST https://pognali-mcp.onrender.com/mcp             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ai-office-ci","version":"1.0"}}}'
      - name: Verify Pognali files
        if: always()
        run: |
          curl --fail --silent --show-error https://raw.githubusercontent.com/esv1312-crypto/pognali3/chatgpt-mvp-skeleton/chatgpt/mcp/server.py >/dev/null
          curl --fail --silent --show-error https://raw.githubusercontent.com/esv1312-crypto/pognali3/chatgpt-mvp-skeleton/chatgpt/app/pognali-events.html >/dev/null
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-office-audit
          path: office-audit.log