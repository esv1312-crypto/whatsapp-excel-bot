name: AI-OFFICE Room Launch

on:
  issue_comment:
    types: [created]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  live-execute:
    if: github.event_name == 'push' || (github.event_name == 'issue_comment' && github.event.issue.pull_request == null && github.event.comment.body == '/office execute')
    runs-on: ubuntu-latest
    steps:
      - name: Start — INTAKE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && ! echo "${{ github.event.head_commit.message }}" | grep -Fq '[office execute]'; then
            echo 'Push is not an execute trigger; exiting cleanly.'
            exit 0
          fi
          gh issue comment "${{ github.event.issue.number || 3 }}" --body "## AI-OFFICE LIVE STATUS
**RUNNING** — этап: **INTAKE**
Задача принята. Scope: `esv1312-crypto/pognali3` / `chatgpt-mvp-skeleton`.
Ограничение: Android/основной «Погнали» не трогаем.
Дальше статус будет появляться по мере выполнения."

      - name: Checkout office
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: RECON
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number || 3 }}" --body "### LIVE → RECON
Проверяю целевой репозиторий, ветку и ChatGPT-контур."
          set -e
          curl --fail --silent --show-error https://raw.githubusercontent.com/esv1312-crypto/pognali3/chatgpt-mvp-skeleton/chatgpt/mcp/server.py -o /tmp/server.py
          curl --fail --silent --show-error https://raw.githubusercontent.com/esv1312-crypto/pognali3/chatgpt-mvp-skeleton/chatgpt/app/pognali-events.html -o /tmp/ui.html
          grep -q 'MCPServer' /tmp/server.py
          grep -q 'ui://pognali/events-v1.html' /tmp/server.py
          gh issue comment "${{ github.event.issue.number }}" --body "### LIVE → RECON
**PASS** — ветка `chatgpt-mvp-skeleton`, MCP server и UI resource найдены."

      - name: PLAN
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number || 3 }}" --body "### LIVE → PLAN
**RUNNING** — определяю проверяемые точки: Core → MCP → tools → UI resource → evidence."

      - name: VERIFY CORE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number || 3 }}" --body "### LIVE → VERIFY
**RUNNING** — запускаю тесты AI-ОФИСА и проверяю live MCP."
          npm install
          set -o pipefail
          : > /tmp/office-tests.log
          failures=0
          for f in tests/*.js; do
            node "$f" 2>&1 | tee -a /tmp/office-tests.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then failures=$((failures+1)); fi
          done
          if [ "$failures" -ne 0 ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "### LIVE → VERIFY
**FAIL** — тесты AI-ОФИСА: ${failures} файл(ов) с ошибками. Смотрим Actions log; следующий цикл — FIX → RETEST."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 -X POST https://pognali-mcp.onrender.com/mcp             -H 'Content-Type: application/json'             -H 'Accept: application/json, text/event-stream'             --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ai-office-live","version":"1.0"}}}'             -o /tmp/mcp.json
          grep -q '"result"' /tmp/mcp.json
          gh issue comment "${{ github.event.issue.number }}" --body "### LIVE → VERIFY
**PASS** — Core tests + MCP initialize."

      - name: EXECUTE boundary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number || 3 }}" --body "### LIVE → EXECUTE
**WAITING_FOR_DRIVER** — CI видит состояние и проверки, но не должен имитировать LLM/Codex-исполнителя. Реальное изменение `pognali3` выполняется только подключённым AI runtime.
Это отображается явно, а не маскируется под RUNNING."

      - name: EVIDENCE
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number || 3 }}" --body "### LIVE → EVIDENCE
**DONE** — результат текущего запуска зафиксирован в Actions. Открытый вопрос: реальный model-side driver для записи изменений в `pognali3/chatgpt-mvp-skeleton`."

  full-audit:
    if: >-
      github.event.issue.pull_request == null &&
      (github.event.comment.body == '/office first-launch' ||
       github.event.comment.body == '/office audit')
    runs-on: ubuntu-latest
    steps:
      - name: Start status
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body "### AI-OFFICE LIVE → AUDIT
**RUNNING** — этап: RECON → VERIFY → EVIDENCE."

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run full AI-OFFICE test suite
        shell: bash
        run: |
          set +e
          : > office-audit.log
          failures=0
          for f in tests/*.js; do
            echo "=== TEST $f ===" | tee -a office-audit.log
            node "$f" 2>&1 | tee -a office-audit.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then
              echo "FAIL: $f (exit $rc)" | tee -a office-audit.log
              failures=$((failures+1))
            else
              echo "PASS: $f" | tee -a office-audit.log
            fi
          done
          echo "=== TEST SUMMARY: failures=$failures ===" | tee -a office-audit.log
          exit "$failures"

      - name: Audit Pognali MCP endpoint
        if: always()
        shell: bash
        run: |
          set -e
          curl --fail --silent --show-error --max-time 30 https://pognali-mcp.onrender.com/ >/dev/null
          curl --fail --silent --show-error --max-time 30 -X POST https://pognali-mcp.onrender.com/mcp \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ai-office-audit","version":"1.0"}}}' \
            | tee mcp-initialize.log
          grep -Eq '"result"|"jsonrpc"' mcp-initialize.log

      - name: Audit Pognali project contour
        if: always()
        shell: bash
        run: |
          set -e
          curl --fail --silent --show-error https://raw.githubusercontent.com/esv1312-crypto/pognali3/chatgpt-mvp-skeleton/chatgpt/mcp/server.py >/dev/null
          curl --fail --silent --show-error https://raw.githubusercontent.com/esv1312-crypto/pognali3/chatgpt-mvp-skeleton/chatgpt/app/pognali-events.html >/dev/null

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-office-full-audit
          path: |
            office-audit.log
            mcp-initialize.log

      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "### AI-OFFICE LIVE → EVIDENCE
**PASS** — полный аудит завершён. Детали и артефакты доступны в этом запуске Actions."
          else
            gh issue comment "${{ github.event.issue.number }}" --body "### AI-OFFICE LIVE → EVIDENCE
**FAIL** — аудит завершён с ошибкой. Точный этап и лог доступны в этом запуске Actions."
          fi
