name: AI-OFFICE Room Launch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  first-launch:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.comment.body == '/office first-launch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run AI-OFFICE first launch
        run: npm run first-launch 2>&1 | tee first-launch.log

      - name: Upload launch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-office-first-launch-log
          path: first-launch.log

      - name: Report result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "AI-OFFICE first launch: PASS"
          else
            gh issue comment "$ISSUE_NUMBER" --body "AI-OFFICE first launch: FAIL — see Actions log/artifact."
          fi
